services:
  db:
    image: postgres:17
    container_name: mise-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mise
    ports:
      - "5433:5432" # 5433 to avoid clashing with a native Postgres on 5432
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - mise-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mise"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  mise-db-data:
